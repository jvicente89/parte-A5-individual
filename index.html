<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Parte Noche VLC">
<meta name="theme-color" content="#0d1119">
<link rel="manifest" href="manifest.json">
<title>Parte Operativo Valencia</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --bg:#0d1119;--card:#151b28;--line:#273148;--tx:#e8edf6;--mut:#8b97ad;--ac:#3b82f6;--ok:#34d399;--bad:#f87171
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  padding-bottom:calc(20px + var(--sab));
  background:var(--bg);color:var(--tx);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Arial,sans-serif
}
header{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:calc(12px + var(--sat)) 16px 12px;
  background:var(--card);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:5
}
h1{font-size:17px;margin:0}
.tag{background:#3b82f633;color:#93c5fd;border:1px solid #3b82f666;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;margin-left:8px}
#clock{color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.layout{display:grid;grid-template-columns:420px 1fr;gap:20px;padding:16px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.card+.card{margin-top:14px}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:10px 0 4px}
label:first-child{margin-top:0}
input,select,textarea{
  width:100%;background:var(--bg);color:var(--tx);
  border:1px solid var(--line);border-radius:8px;
  padding:9px 10px;font-size:16px;font-family:inherit
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px}
textarea{resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1;min-width:0}
.row>.fit{flex:none}
button{
  background:#1d2740;color:var(--tx);border:1px solid var(--line);
  border-radius:8px;padding:9px 13px;font:600 14px/1.2 inherit;cursor:pointer;
  min-height:38px
}
button:active{transform:scale(0.99)}
button:hover{background:#26335a}
button.pri{background:var(--ac);border-color:var(--ac)}
button.pri:hover{background:#2563eb}
button.dan{color:var(--bad)}
button.sm{padding:6px 10px;font-size:12px;min-height:32px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar input,.bar select{width:auto;flex:1;min-width:140px;font-size:14px}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:10px}
table{width:100%;border-collapse:collapse;min-width:680px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}
th{font-size:12px;color:var(--mut);font-weight:600;background:var(--card)}
td.nw{white-space:nowrap}
.empty{text-align:center;color:var(--mut);padding:28px 12px}
#toast{
  position:fixed;bottom:calc(16px + var(--sab));left:16px;right:16px;max-width:420px;margin:0 auto;
  background:var(--card);border:1px solid var(--line);border-left:4px solid var(--ok);
  padding:10px 14px;border-radius:8px;display:none;z-index:30;box-shadow:0 8px 24px #0008
}
#toast.err{border-left-color:var(--bad)}
#edit{display:none;background:#f59e0b22;border:1px solid #f59e0b66;color:#fcd34d;border-radius:8px;padding:8px 10px;margin-bottom:12px;justify-content:space-between;align-items:center}
.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.on{display:flex}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;max-width:360px;width:100%}
.btnlink{display:block;text-align:center;text-decoration:none;background:#1d2740;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-weight:600;margin-bottom:8px}
@media(max-width:900px){
  .layout{grid-template-columns:1fr;gap:14px;padding:12px}
  header{padding-left:12px;padding-right:12px}
}
@media print{header,.form,.bar,td.act,th.act{display:none!important}body{background:#fff;color:#000}.card{border:0}th,td{color:#000;border:1px solid #333}th{position:static;background:#e2e8f0}}
</style>
</head>
<body>
<header>
  <div><h1 style="display:inline">Parte Operativo Valencia</h1><span class="tag">TURNO: NOCHE</span></div>
  <div id="clock"></div>
</header>

<div class="layout">
  <section class="form">
    <form id="f" class="card" autocomplete="off">
      <div id="edit"><span>Editando actuación</span><button type="button" class="sm" id="cancelEdit">Cancelar</button></div>

      <label for="fecha">Fecha</label>
      <div class="row"><input type="date" id="fecha" required><button type="button" class="fit sm" id="hoy">Hoy</button></div>

      <label for="unidad">Unidad / Patrulla</label>
      <select id="unidad"><option>7-40</option><option>7-50</option><option>7-51</option><option>7-52</option><option>Malva 50</option><option value="__M">Manual...</option></select>
      <input id="unidadMan" placeholder="Escribe la unidad o patrulla" style="display:none;margin-top:6px">

      <label>Indicativos (mínimo 2)</label>
      <div id="inds"></div>
      <button type="button" class="sm" id="addInd" style="margin-top:6px">+ Añadir indicativo</button>

      <label for="calle">Calle de Valencia</label>
      <input id="calle" list="dlCalle" placeholder="Escribe para buscar (Colón, Aragón, Manuel...)" required>
      <datalist id="dlCalle"></datalist>
      <select id="calleSel" style="margin-top:6px"></select>
      <div class="row" style="margin-top:8px">
        <button type="button" class="sm" id="cargarCalles">Cargar callejero oficial de Valencia</button>
        <button type="button" class="sm" id="importCalles">Importar archivo</button>
        <input type="file" id="fileCalles" accept=".csv,.json,.txt" style="display:none">
      </div>
      <div id="callesInfo" style="color:var(--mut);font-size:12px;margin-top:4px"></div>

      <label for="portal">Nº / portal / tramo (opcional)</label>
      <input id="portal" placeholder="Ej. nº 14, esq. Colón">

      <div class="row" style="margin-top:10px">
        <div><label for="hi">Hora inicio (24h)</label><div class="row"><input type="time" id="hi" required><button type="button" class="fit sm" data-now="hi">Ahora</button></div></div>
        <div><label for="hf">Hora fin (24h)</label><div class="row"><input type="time" id="hf"><button type="button" class="fit sm" data-now="hf">Ahora</button></div></div>
      </div>

      <label for="sire">Número SIRE</label>
      <input id="sire" inputmode="numeric">

      <label for="actSel">Actuación</label>
      <select id="actSel">
        <option value="">-- Seleccionar actuación --</option>
        <option>Vigilancia actos incívicos - sin novedad</option>
        <option>Moletias por ruido - se le indica de la problematica cesando estos</option>
	    <option>Moletias por ruido - se le indica de la problematica, se realiza acta denuncia por contaminacion acustica</option>
        <option>Vigilancia centro de aves - sin novedad</option>
        <option>Vigilancia ocio nocturno - sin novedad</option>
        <option>Vigilancia vehículos mal estacionados - sin novedad</option>
        <option>Identificar persona sospechosa</option>
      </select>
      <textarea id="act" rows="3" required style="margin-top:6px" placeholder="Elige arriba o escribe libremente"></textarea>

      <div class="row" style="margin-top:14px">
        <button type="button" id="limpiar" class="fit">Limpiar</button>
        <button type="submit" class="pri" id="save">Guardar actuación</button>
      </div>
    </form>
  </section>

  <section class="card">
    <div class="bar">
      <input id="q" placeholder="Filtrar por unidad, calle o SIRE...">
      <select id="turnoSel"></select>
      <select id="fu"><option value="">Todas las unidades</option></select>
      <span id="count" style="color:var(--mut);font-size:13px"></span>
    </div>
    <div class="bar" style="margin-top:10px">
      <button class="pri" id="pdf">Exportar PDF</button>
      <button id="pdfShare">Compartir PDF</button>
      <button id="csv">Exportar CSV</button>
      <button id="copy">Copiar parte</button>
      <button id="print">Imprimir</button>
      <button class="dan" id="clearAll" style="margin-left:auto">Vaciar turno</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Fecha</th><th>Unidad</th><th>Indicativos</th><th>Hora</th><th>Lugar</th><th>SIRE</th><th>Actuación</th><th class="act"></th></tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
    <div id="empty" class="empty" style="display:none">Todavía no hay actuaciones en este turno. Rellena el formulario y pulsa Guardar actuación.</div>
  </section>
</div>

<div id="modal" class="modal"><div class="box"><h3 id="mTitle" style="margin:0 0 6px"></h3><p id="mText" style="color:var(--mut);margin:0 0 16px"></p><div class="row"><button type="button" id="mNo">Cancelar</button><button type="button" class="dan" id="mYes">Borrar</button></div></div></div>
<div id="pdfModal" class="modal"><div class="box">
  <h3 style="margin:0 0 6px">PDF listo</h3>
  <p id="pdfName" style="color:var(--mut);margin:0 0 14px;word-break:break-all"></p>
  <button type="button" class="pri" id="pdfShareBtn" style="width:100%;margin-bottom:8px">Guardar en Archivos / Compartir</button>
  <a id="pdfOpen" class="btnlink" target="_blank" rel="noopener">Abrir PDF</a>
  <a id="pdfDl" class="btnlink">Descargar</a>
  <button type="button" id="pdfClose" style="width:100%">Cerrar</button>
</div></div>
<div id="toast"></div>

const key=()=>'parte_noche_'+sala.toLowerCase().replace(/[^a-z0-9]+/g,'_');
const load=()=>{try{recs=JSON.parse(localStorage.getItem(key()))||[]}catch(e){recs=[]}};
const persist=()=>{try{localStorage.setItem(key(),JSON.stringify(recs))}catch(e){toast('No se pudo guardar en el equipo',1)}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function nowHM(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

/* Unidad */
function getUnidad(){return $('unidad').value==='__M'?$('unidadMan').value.trim():$('unidad').value}
function setUnidad(v){const k=[...$('unidad').options].some(o=>o.value===v&&o.value!=='__M');$('unidad').value=k?v:'__M';$('unidadMan').value=k?'':v;$('unidadMan').style.display=k?'none':'block'}
$('unidad').onchange=()=>{const m=$('unidad').value==='__M';$('unidadMan').style.display=m?'block':'none';if(m)$('unidadMan').focus()};

/* Indicativos */
function addInd(v=''){
  const known=INDS.includes(v),w=document.createElement('div');w.style.marginBottom='8px';
  w.innerHTML=`<div class="row"><select class="indsel"><option value="">-- Seleccionar indicativo --</option>${INDS.map(i=>`<option ${i===v?'selected':''}>${i}</option>`).join('')}<option value="__M" ${v&&!known?'selected':''}>Manual...</option></select></div><input class="indman" placeholder="Escribe el indicativo" value="${v&&!known?esc(v):''}" style="margin-top:4px;display:${v&&!known?'block':'none'}">`;
  const sel=w.querySelector('select'),man=w.querySelector('.indman');
  sel.onchange=()=>{man.style.display=sel.value==='__M'?'block':'none';if(sel.value==='__M')man.focus()};
  if($('inds').children.length>=2){const b=document.createElement('button');b.type='button';b.className='fit sm dan';b.textContent='Quitar';b.onclick=()=>w.remove();w.firstChild.appendChild(b)}
  $('inds').appendChild(w);
}
function setInds(list){$('inds').innerHTML='';const n=Math.max(2,list.length);for(let k=0;k<n;k++)addInd(list[k]||'')}
const getInds=()=>[...$('inds').children].map(w=>{const v=w.querySelector('select').value;return v==='__M'?w.querySelector('.indman').value.trim():v}).filter(Boolean);

/* Formulario */
function resetForm(keepDate){
  editId=null;$('edit').style.display='none';$('save').textContent='Guardar actuación';
  if(!keepDate)$('fecha').value=today();
  setUnidad('7-40');setInds([]);$('calle').value='';$('calleSel').value='';$('portal').value='';
  $('hi').value=nowHM();$('hf').value='';$('sire').value='';$('actSel').value='';$('act').value='';
}
$('f').addEventListener('submit',e=>{
  e.preventDefault();
  const inds=getInds();
  if(!inds.length){toast('Indica al menos un indicativo',1);return}
  const calle=$('calle').value.trim(),portal=$('portal').value.trim();
  const r={id:editId||('r'+Date.now()),fechaISO:$('fecha').value,unidad:getUnidad(),indicativos:inds,calle,portal,
    lugar:portal?calle+', '+portal:calle,hi:$('hi').value,hf:$('hf').value||'--:--',sire:$('sire').value.trim()||'-',actuacion:$('act').value.trim(),ts:Date.now()};
  if(editId){recs=recs.map(x=>x.id===editId?r:x);toast('Actuación actualizada')}else{recs.push(r);toast('Actuación guardada')}
  persist();resetForm(true);render();
});
$('limpiar').onclick=()=>{resetForm();toast('Formulario limpiado')};
$('cancelEdit').onclick=()=>resetForm(true);

$('actSel').onchange=e=>{if(e.target.value)$('act').value=e.target.value};

function edit(id){
  const r=recs.find(x=>x.id===id);if(!r)return;
  editId=id;$('fecha').value=r.fechaISO;setUnidad(r.unidad);setInds(r.indicativos);
  $('calle').value=r.calle;$('portal').value=r.portal||'';$('hi').value=r.hi;$('hf').value=r.hf==='--:--'?'':r.hf;
  $('sire').value=r.sire==='-'?'':r.sire;$('act').value=r.actuacion;$('actSel').value='';
  $('edit').style.display='flex';$('save').textContent='Actualizar actuación';window.scrollTo({top:0,behavior:'smooth'});
}
let askCb=null;
function ask(t,m,cb){$('mTitle').textContent=t;$('mText').textContent=m;askCb=cb;$('modal').classList.add('on')}
function closeAsk(){$('modal').classList.remove('on');askCb=null}
function del(id){ask('¿Eliminar actuación?','Se borrará este registro del turno.',()=>{recs=recs.filter(x=>x.id!==id);persist();render();toast('Actuación eliminada')})}

/* Listado */
function addDays(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const turnoDe=r=>r.hi<'12:00'?addDays(r.fechaISO,-1):r.fechaISO;
const turnoAhora=()=>nowHM()<'12:00'?addDays(today(),-1):today();
const turnoTxt=d=>'Noche '+fES(d)+' (21:45 a 06:15 del '+fES(addDays(d,1))+')';
let turnoElegido=turnoAhora();
const clave=r=>(r.hi<'12:00'?'1':'0')+r.hi;
const sorted=()=>[...recs].sort((a,b)=>turnoDe(a).localeCompare(turnoDe(b))||clave(a).localeCompare(clave(b)));
function fillTurnos(){
  const set=new Set(recs.map(turnoDe));set.add(turnoAhora());
  const ds=[...set].sort().reverse();
  $('turnoSel').innerHTML='<option value="">Todos los turnos</option>'+ds.map(d=>`<option value="${d}">${esc(turnoTxt(d))}</option>`).join('');
  $('turnoSel').value=(turnoElegido===''||set.has(turnoElegido))?turnoElegido:'';
}
$('turnoSel').onchange=e=>{turnoElegido=e.target.value;render()};
function filtered(){
  const q=norm($('q').value),u=$('fu').value,t=turnoElegido;
  return sorted().filter(r=>(!t||turnoDe(r)===t)&&(!u||r.unidad===u)&&(!q||norm([r.unidad,r.indicativos.join(' '),r.lugar,r.sire,r.actuacion].join(' ')).includes(q)));
}
function render(){
  fillTurnos();
  const list=filtered();
  $('count').textContent=list.length===recs.length?recs.length+' registros':list.length+' de '+recs.length;
  $('empty').style.display=recs.length?'none':'block';
  $('tb').innerHTML=list.map(r=>`<tr><td class="nw">${fES(r.fechaISO)}</td><td><b>${esc(r.unidad)}</b></td><td>${esc(r.indicativos.join(' / '))}</td><td class="nw">${esc(r.hi)} - ${esc(r.hf)}</td><td>${esc(r.lugar)}</td><td>${esc(r.sire)}</td><td>${esc(r.actuacion)}</td><td class="act nw"><button class="sm" onclick="edit('${r.id}')">Editar</button> <button class="sm dan" onclick="del('${r.id}')">Borrar</button></td></tr>`).join('');
}
$('q').oninput=render;$('fu').onchange=render;

  doc.text('Unidad:', col1X, curY);
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(0,0,0);
  doc.text(doc.splitTextToSize(String(r.unidad||''), innerW*0.30).slice(0,1), col1X+14.5, curY);

  doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.setTextColor(30,41,59);
  doc.text('Indicativos:', col2X, curY);
  doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(0,0,0);
  const indsTxt=(r.indicativos||[]).join(' / ');
  doc.text(doc.splitTextToSize(indsTxt, innerW*0.36).slice(0,2), col2X+19.5, curY);

  doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.setTextColor(30,41,59);
  doc.text('SIRE:', col3X, curY);
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(0,0,0);
  doc.text(doc.splitTextToSize(String(r.sire&&r.sire!=='-'?r.sire:'-'), innerW*0.24).slice(0,1), col3X+11, curY);

  // Fila 2 de campos: Calle | Hora
  curY=y+21;
  doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.setTextColor(30,41,59);
  doc.text('Calle:', col1X, curY);
  doc.setFont('helvetica','normal');doc.setFontSize(8.8);doc.setTextColor(0,0,0);
  const calleLines=doc.splitTextToSize(String(r.lugar||''), innerW*0.56).slice(0,2);
  doc.text(calleLines, col1X+11.5, curY);

  doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.setTextColor(30,41,59);
  doc.text('Hora:', col3X, curY);
  doc.setFont('helvetica','normal');doc.setFontSize(8.8);doc.setTextColor(0,0,0);
  const horaTxt=(r.hi||'')+(r.hf&&r.hf!=='--:--'?' - '+r.hf:'');
  doc.text(doc.splitTextToSize(horaTxt, innerW*0.24).slice(0,1), col3X+11, curY);

  // Recuadro inferior: Actuación
  const boxTop=y+27.5;
  const boxBottom=y+h-pad;
  const boxH=Math.max(18, boxBottom-boxTop);

  doc.setFont('helvetica','bold');
  doc.setFontSize(8.5);
  doc.setTextColor(30,41,59);
  doc.text('Actuación:', innerX, boxTop+3.5);

  const frameTop=boxTop+5;
  const frameH=Math.max(12, boxBottom-frameTop);
  doc.setDrawColor(30,64,175);
  doc.setLineWidth(0.45);
  doc.rect(innerX, frameTop, innerW, frameH);

  doc.setFont('helvetica','normal');
  doc.setFontSize(8.8);
  doc.setTextColor(15,23,42);
  const actLines=doc.splitTextToSize(String(r.actuacion||''), innerW-5);
  const maxLines=Math.max(1, Math.floor((frameH-4)/3.8));
  const shown=actLines.slice(0,maxLines);
  if(actLines.length>maxLines){
    shown[maxLines-1]=shown[maxLines-1].replace(/.{0,3}$/,'...');
  }
  doc.text(shown, innerX+2.5, frameTop+4);
}

function exportPDFraw(share){
  const list=filtered();
  if(!list.length){toast('No hay actuaciones para exportar',1);return}
  if(!window.jspdf){toast('No se cargó el generador de PDF. Comprueba la conexión.',1);return}
  const {jsPDF}=window.jspdf;
  // Tamaño A5 vertical (148mm x 210mm) con 2 servicios por página
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a5'});
  const pageW=148, pageH=210;
  const marginX=5, marginTop=5, marginBottom=5, gap=4;
  const slotW=pageW-marginX*2;
  const slotH=(pageH-marginTop-marginBottom-gap)/2;

  for(let i=0;i<list.length;i++){
    if(i>0 && i%2===0)doc.addPage('a5','portrait');
    const slotIdx=i%2;
    const y=marginTop+slotIdx*(slotH+gap);
    drawServicioFicha(doc, list[i], marginX, y, slotW, slotH, i+1, list.length);

    if(slotIdx===0 && i+1<list.length){
      const sepY=marginTop+slotH+gap/2;
      doc.setDrawColor(148,163,184);
      doc.setLineDashPattern([2,2],0);
      doc.setLineWidth(0.25);
      doc.line(marginX, sepY, pageW-marginX, sepY);
      doc.setLineDashPattern([],0);
    }
  }

  const blob=doc.output('blob'),nombre=nombreBase()+'.pdf';
  const file=new File([blob],nombre,{type:'application/pdf'});
  if(share&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:nombre}).catch(()=>{});
    return;
  }
  mostrarPDF(blob,nombre);
}

/* Callejero oficial */
const URL_VIAS='https://mapas.valencia.es/lanzadera/opendata/vias/csv';
const TIPOS={CL:'Calle',AV:'Avenida',AVDA:'Avenida',PZ:'Plaza',PL:'Plaza',PS:'Paseo',PG:'Paseo',CM:'Camino',RD:'Ronda',TR:'Travesía',GV:'Gran Vía',CR:'Carretera',CTRA:'Carretera',PJ:'Pasaje',CJ:'Callejón',BV:'Bulevar',PQ:'Parque',MU:'Muelle',SD:'Senda',AC:'Acceso',UR:'Urbanización'};
function fillCalles(){
  $('calleSel').innerHTML='<option value="">-- Elegir calle del desplegable ('+CALLES.length+') --</option>'+CALLES.map(c=>`<option>${esc(c)}</option>`).join('');
  $('dlCalle').innerHTML=CALLES.map(c=>`<option value="${esc(c)}">`).join('');
  $('callesInfo').textContent=CALLES.length+' vías cargadas';
}
$('calleSel').onchange=e=>{if(e.target.value)$('calle').value=e.target.value};
function titulo(t){
  if(t!==t.toUpperCase())return t;
  return t.toLowerCase().replace(/(^|[\s(\-\/])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase()).replace(/\b(De|Del|La|Las|Los|El|Y|Dels|Al|En)\b/g,x=>x.toLowerCase()).replace(/^./,c=>c.toUpperCase());
}
function parseCSV(t){
  const first=t.split(/\r?\n/,1)[0],d=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',';
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===d){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=c;
  }
  if(f.length||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()!==''));
}
function extractCallesFromRows(rows){
  if(!rows.length)return[];
  const hdr=rows[0].map(h=>norm(h));
  const iNom=hdr.findIndex(h=>/^(nom|nombre|via|vial|denominacion|calle|rotulo|etiqueta)/.test(h));
  const iTipo=hdr.findIndex(h=>/^(tipo|tipovia|clase|tvia|sigla)/.test(h));
  const start=(iNom>=0||iTipo>=0)?1:0;
  const out=new Set();
  for(let r=start;r<rows.length;r++){
    const row=rows[r];
    let nom=iNom>=0?(row[iNom]||''):row.find(x=>/[A-Za-zÁÉÍÓÚÜÑàèéíóúüç]{3,}/.test(x))||'';
    nom=titulo(nom.trim().replace(/\s+/g,' '));
    if(!nom||nom.length<2)continue;
    let tipo=iTipo>=0?(row[iTipo]||'').trim().toUpperCase():'';
    if(TIPOS[tipo])tipo=TIPOS[tipo];
    else tipo=titulo(tipo);
    const full=(tipo && !new RegExp('^'+tipo.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i').test(nom))?nom+', '+tipo:nom;
    out.add(full);
  }
  return[...out].sort((a,b)=>a.localeCompare(b,'es'));
}
function applyCalles(list,msg){
  if(!list||!list.length){toast('No se encontraron calles en el origen',1);return}
  CALLES=list;fillCalles();
  try{localStorage.setItem('calles_vlc_v2',JSON.stringify(CALLES))}catch(e){}
  toast(msg||(CALLES.length+' calles cargadas'));
}
async function cargarCallesOficiales(){
  $('callesInfo').textContent='Consultando callejero oficial de Valencia...';
  const urls=[URL_VIAS,'https://api.allorigins.win/raw?url='+encodeURIComponent(URL_VIAS)];
  for(const u of urls){
    try{
      const res=await fetch(u);
      if(!res.ok)continue;
      const txt=await res.text();
      const list=extractCallesFromRows(parseCSV(txt));
      if(list.length>50){applyCalles(list,'Callejero oficial cargado ('+list.length+' vías)');return}
    }catch(e){}
  }
  $('callesInfo').textContent=CALLES.length+' vías cargadas (sin conexión directa al portal)';
  toast('No se pudo descargar en línea; puedes usar "Importar archivo"',1);
}
$('cargarCalles').onclick=cargarCallesOficiales;
$('importCalles').onclick=()=>$('fileCalles').click();
$('fileCalles').onchange=async e=>{
  const file=e.target.files[0];e.target.value='';if(!file)return;
  const txt=await file.text();
  try{
    const j=JSON.parse(txt);
    const arr=Array.isArray(j)?j:(j.features||j.data||j.records||[]);
    const list=arr.map(it=>{
      const p=it.properties||it;
      if(typeof p==='string')return titulo(p.trim());
      return titulo(String(p.nombre||p.nom||p.calle||p.via||p.label||'').trim());
    }).filter(Boolean);
    if(list.length){applyCalles([...new Set(list)].sort((a,b)=>a.localeCompare(b,'es')),'Importadas '+list.length+' calles');return}
  }catch(err){}
  const list=extractCallesFromRows(parseCSV(txt));
  applyCalles(list,'Importadas '+list.length+' calles');
};
